<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Select a GeoIndex query to explore precomputed remote-sensing retrieval results.">
  <meta name="color-scheme" content="dark">
  <title>GeoIndex · Select a query</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/style.css?v=2">
  <script defer src="data/catalog.js?v=2"></script>
  <script defer src="assets/app.js?v=2"></script>
</head>
<body data-page="search">
  <header class="topbar"><a class="brand" href="index.html" aria-label="GeoIndex home"><span class="brand-mark" aria-hidden="true">G</span>Geo<span>Index</span></a><button id="language" type="button" class="language">中文</button></header>
  <main class="search-page">
    <section class="search-panel" aria-labelledby="page-title">
      <p class="eyebrow" data-i18n="eyebrow">REMOTE-SENSING RETRIEVAL</p>
      <h1 id="page-title" data-i18n="title">Choose a scene to explore.</h1>
      <p class="lead" data-i18n="intro">Select a query, then view its saved retrieval results.</p>
      <form id="query-form" action="results.html" method="get">
        <label for="query-select" data-i18n="selectLabel">Retrieval query</label>
        <select id="query-select" name="q" required aria-describedby="selection-message"><option value="" data-i18n="placeholder">Select a query…</option></select>
        <input id="form-language" type="hidden" name="lang" value="en">
        <p id="selection-message" class="selection-message" role="status" aria-live="polite"></p>
        <button id="confirm-query" type="submit" class="primary-button" disabled><span data-i18n="confirm">View results</span><span aria-hidden="true">→</span></button>
      </form>
      <p class="precomputed-note" data-i18n="precomputed">Precomputed examples · No live search</p>
    </section>
    <noscript><p>Please enable JavaScript to select a saved query. 请启用 JavaScript 后选择检索词条。</p></noscript>
  </main>
  <footer><span>GeoIndex</span><span data-i18n="footer">Remote-sensing retrieval, with evidence.</span></footer>
</body>
</html>
